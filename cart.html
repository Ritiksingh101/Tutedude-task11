<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <title>Thala 7 - Sneaker Store</title>
</head>
<body>
    <main class="cart-container">
    <div class="cart-left">
        <h1>Shopping Cart</h1>
        
        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Seven By M.S.Dhoni W...</td>
                    <td>
                        <div class="qty-control">- 1 +</div>
                    </td>
                    <td>₹4,999</td>
                    <td><i class="fa fa-times remove-icon"></i></td>
                </tr>
                <tr>
                    <td>Seven By M.S.Dhoni W...</td>
                    <td>
                        <div class="qty-control">- 1 +</div>
                    </td>
                    <td>₹4,999</td>
                    <td><i class="fa fa-times remove-icon"></i></td>
                </tr>
            </tbody>
        </table>

        <div class="continue-shopping">
            <a href="intex.html"><i class="fa fa-chevron-left"></i> Continue Shopping</a>
        </div>
    </div>

    <div class="cart-right">
        <div class="summary-card">
            <label>Enter Coupon Code</label>
            <div class="coupon-row">
                <input type="text" placeholder="COUPON CODE">
                <button class="apply-btn">Apply Coupon</button>
            </div>

            <div class="summary-details">
                <div class="detail-line"><span>Sub Total</span> <span>₹4,700</span></div>
                <div class="detail-line"><span>Taxes (if applicable)</span> <span>₹299</span></div>
                <div class="detail-line"><span>Discount</span> <span>₹0</span></div>
                <div class="detail-line total"><span>Total</span> <span>₹4,999</span></div>
            </div>
        </div>

        <a href="payment.html">

        <button class="pay-btn">Pay Now ₹4,999</button>

        </a>
        
        <div class="payment-trust-icons">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcREkn5GJ4WofPhNkxdDH5-s5lsBgtRVvA6QkQ&s" alt="Razorpay">
            </div>
    </div>
</main>
    
</body>
</html>
